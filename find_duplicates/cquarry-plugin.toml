# The CalibreQuarry plugin manifest contract; the field semantics live in the
# repo spec.md and the host checks all three version gates fail-closed at
# install, update, and load. Skeleton: the implementation lands in the Phase 2
# port; the calibrequarry floor names the host release expected to carry the
# plugin API and is re-pinned when that release cuts.

schema = 1
name = "find_duplicates"
version = "0.4.0"
api_version = 3
license = "GPL-3.0-only"
capabilities = ["read", "write"]
entry = "plugin:register"
description = "Find duplicate books across the matcher ladder (identical/similar/soundex/fuzzy), byte-identical formats, and identifiers, with group reports and gated merge actions (a 1:1 port of kiwidude68's Find Duplicates)."

[requires]
cquarry = ">=1.29.2"       # verified against the current engine release
calibrequarry = ">=3.95.2" # contract 3 (the plan seam) + the action gates

[upstream]
source = "https://github.com/kiwidude68/calibre_plugins"
plugin = "find_duplicates"
version = "1.10.11"
license = "GPL-3.0"
derivation = "port"

[verify]
probes = ["search --type identifier", "exempt --list", "variations --item authors", "merge --keeper 1 --ids 2"]

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# A newer push to the same branch supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite itself finishes in seconds; 15 minutes bounds a hung
    # pip resolve or runner, not the tests.
    timeout-minutes: 15
    steps:
      # Same SHA pins the host repo (CalibreQuarry) uses, so dependabot
      # bumps the fleet together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.15.20
      - run: ruff check extract_isbn find_duplicates quality_check tests
      - run: ruff format --check extract_isbn find_duplicates quality_check tests
      # The plugin ports import the host's public APIs: install the pair.
      - run: pip install git+https://github.com/VirInvictus/cquarry.git@main
      - run: pip install git+https://github.com/VirInvictus/CalibreQuarry.git@main
      - run: python -m unittest discover -s tests

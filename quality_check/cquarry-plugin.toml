# The CalibreQuarry plugin manifest contract; the field semantics live in the
# repo spec.md and the host checks all three version gates fail-closed at
# install, update, and load. The check battery is multi-file (the package
# loader, host >=3.96.0).

schema = 1
name = "quality_check"
version = "0.5.0"
api_version = 3
license = "GPL-3.0-only"
capabilities = ["read", "write"]
entry = "plugin:register"
description = "A battery of cover, ePub-structure, ePub-style, MOBI/AZW, and metadata-quality checks with gated fixes (a 1:1 port of kiwidude68's Quality Check)."

[requires]
cquarry = ">=1.29.2"       # verified against the current engine release
calibrequarry = ">=3.96.1" # the package loader (multi-file plugins)

[upstream]
source = "https://github.com/kiwidude68/calibre_plugins"
plugin = "quality_check"
version = "1.15.0"
license = "GPL-3.0"
derivation = "port"

[verify]
probes = ["check --family epub", "exclude --list"]
